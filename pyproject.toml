[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pedestrian-tracking"
version = "0.1.0"
description = "A reproducible MOT17 pedestrian tracking research project"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.3"]
appearance = ["torch==2.9.1", "torchvision==0.24.1", "Pillow==12.0.0"]

[project.scripts]
pedtrack = "tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
